<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Bot</title>
  <style>
    :root {
      --bg:         #f0f2f5;
      --surface:    #ffffff;
      --border:     #e1e4e8;
      --text:       #24292e;
      --text-muted: #6a737d;
      --accent:     #0366d6;
      --win:        #22863a;
      --loss:       #cb2431;
      --radius:     8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    #status-bar { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    #status-bar span { font-weight: 500; color: var(--text); }

    /* ── Tab bar ── */
    .tabs-header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 0 24px;
      display: flex;
      gap: 0;
    }
    .tab-btn {
      padding: 10px 22px;
      font-size: 13px; font-weight: 500;
      border: none; background: none; cursor: pointer;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Sub-tab bar (for Forecast day picker) ── */
    .subtabs-header {
      display: flex; gap: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .subtab-btn {
      padding: 6px 16px;
      font-size: 12px; font-weight: 500;
      border: none; background: none; cursor: pointer;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .subtab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .subtab-btn:hover:not(.active) { color: var(--text); }
    .subtab-panel { display: none; }
    .subtab-panel.active { display: block; }

    /* ── Main content area ── */
    main { max-width: 1080px; margin: 0 auto; padding: 20px 16px; }

    /* ── Location section ── */
    .loc-section { margin-bottom: 28px; }
    .loc-header {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .6px; color: var(--text-muted);
      padding-bottom: 6px; margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .loc-header span { color: var(--text); }

    /* ── Bet tables ── */
    .no-data { font-size: 13px; color: var(--text-muted); padding: 4px 0 8px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .4px; color: var(--text-muted);
      padding: 3px 10px 5px 0; text-align: left; white-space: nowrap;
    }
    tbody td {
      padding: 5px 10px 5px 0; border-top: 1px solid var(--border);
      vertical-align: middle; white-space: nowrap;
    }
    tbody td.market-cell { white-space: normal; }
    tbody tr:hover td { background: #f8f9fa; }

    .ticker { font-family: monospace; font-size: 12px; color: var(--text-muted); }
    .date-cell { font-size: 12px; color: var(--text-muted); }
    .snap-badge {
      font-size: 11px; padding: 1px 6px; border-radius: 10px;
      background: #f1f3f5; border: 1px solid var(--border); color: var(--text-muted);
    }

    .outcome {
      display: inline-block; min-width: 28px; text-align: center;
      font-weight: 700; font-size: 12px; padding: 2px 5px; border-radius: 4px;
    }
    .outcome.W { color: var(--win);  background: #dcffe4; }
    .outcome.L { color: var(--loss); background: #ffebe9; }
    .outcome.pending { color: var(--text-muted); background: #f1f3f5; font-weight: 400; font-size: 11px; }
    .outcome.unknown { color: var(--text-muted); }

    /* ── Forecast cards ── */
    .fc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 12px;
      overflow-x: auto;
    }
    .fc-card-header {
      font-size: 12px; font-weight: 600; color: var(--text-muted);
      margin-bottom: 10px;
    }
    .fc-card-header span { color: var(--text); }

    .fc-row {
      display: flex; align-items: center; gap: 10px;
      min-width: 520px;
      margin-bottom: 6px;
    }
    .fc-label {
      width: 52px; flex-shrink: 0;
      font-size: 12px; font-weight: 600; text-align: right;
    }
    .fc-label.daily-lbl { color: #0969da; }
    .fc-label.intra-lbl { color: var(--win); }
    .fc-label.latest-lbl { color: #b08800; }

    .fc-meta {
      width: 100px; flex-shrink: 0;
      font-size: 12px; color: var(--text-muted);
    }
    .fc-meta strong { color: var(--text); font-size: 13px; }

    .fc-bar {
      flex: 1; position: relative; height: 22px;
    }
    .fc-2s, .fc-1s, .fc-mu { position: absolute; }
    .fc-2s { top: 5px; height: 12px; border-radius: 6px; }
    .fc-1s { top: 3px; height: 16px; border-radius: 4px; }
    .fc-mu { top: 0; height: 22px; width: 3px; border-radius: 2px; transform: translateX(-50%); }

    .daily-row .fc-2s { background: rgba(9,105,218,.14); }
    .daily-row .fc-1s { background: rgba(9,105,218,.42); }
    .daily-row .fc-mu { background: #0969da; }

    .intra-row .fc-2s { background: rgba(34,134,58,.14); }
    .intra-row .fc-1s { background: rgba(34,134,58,.42); }
    .intra-row .fc-mu { background: #22863a; }

    .latest-row { padding-top: 4px; margin-top: 2px; border-top: 1px dashed var(--border); }
    .latest-row .fc-2s { background: rgba(176,136,0,.14); }
    .latest-row .fc-1s { background: rgba(176,136,0,.42); }
    .latest-row .fc-mu { background: #b08800; }

    .fc-obs {
      width: 140px; flex-shrink: 0;
      font-size: 12px; color: var(--text-muted);
      white-space: nowrap;
    }
    .fc-obs .obs-val { color: var(--text); font-weight: 500; }
    .fc-obs .obs-max { color: var(--text-muted); }

    .fc-scale-row {
      display: flex; align-items: flex-start; gap: 10px;
      min-width: 520px; margin-top: 6px;
    }
    .fc-scale-spc { width: calc(52px + 100px + 10px + 10px); flex-shrink: 0; }
    .fc-scale     { flex: 1; position: relative; height: 16px; border-top: 1px solid var(--border); }
    .fc-tick {
      position: absolute; top: 2px;
      font-size: 10px; color: var(--text-muted);
      transform: translateX(-50%); white-space: nowrap;
    }
    /* Spacer accounting for obs column */
    .fc-obs-spc { width: 140px; flex-shrink: 0; }

    tfoot td {
      padding: 6px 0 4px;
      border-top: 2px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }
    .pnl-pos { color: var(--win);  font-weight: 600; }
    .pnl-neg { color: var(--loss); font-weight: 600; }

    .totals-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-top: 20px;
    }
    .totals-bar h3 {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; color: var(--text-muted); margin-bottom: 12px;
    }
    .totals-grid { display: flex; gap: 28px; flex-wrap: wrap; }
    .totals-item .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .3px; }
    .totals-item .val { font-size: 20px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .totals-item .val.pnl-pos { color: var(--win); }
    .totals-item .val.pnl-neg { color: var(--loss); }

    .no-forecast { font-size: 13px; color: var(--text-muted); padding: 4px 0; }
    .loading { color: var(--text-muted); font-size: 13px; padding: 8px 0; }
    .error   { color: var(--loss);       font-size: 13px; padding: 8px 0; }
  </style>
</head>
<body>

<header>
  <h1>Weather Bot</h1>
  <div id="status-bar">Updated: <span id="last-updated">—</span></div>
</header>

<div class="tabs-header">
  <button class="tab-btn active" data-tab="daily">Daily</button>
  <button class="tab-btn"        data-tab="intraday">Intraday</button>
  <button class="tab-btn"        data-tab="forecast">Forecast</button>
</div>

<main>
  <div class="tab-panel active" id="tab-daily">   <div class="loading">Loading…</div></div>
  <div class="tab-panel"        id="tab-intraday"><div class="loading">Loading…</div></div>
  <div class="tab-panel"        id="tab-forecast"><div class="loading">Loading…</div></div>
</main>

<script>
// ─── Config ─────────────────────────────────────────────────────────────────

const LOCATIONS = [
  { code: "atl", name: "Atlanta, GA" },
  { code: "bos", name: "Boston, MA" },
  { code: "chi", name: "Chicago, IL" },
  { code: "dal", name: "Dallas, TX" },
  { code: "dc",  name: "Washington, DC" },
  { code: "den", name: "Denver, CO" },
  { code: "hou", name: "Houston, TX" },
  { code: "lax", name: "Los Angeles, CA" },
  { code: "mia", name: "Miami, FL" },
  { code: "min", name: "Minneapolis, MN" },
  { code: "nyc", name: "New York City, NY" },
  { code: "phx", name: "Phoenix, AZ" },
  { code: "sea", name: "Seattle, WA" },
  { code: "sfo", name: "San Francisco, CA" },
];

// ─── Tab switching ───────────────────────────────────────────────────────────

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

function wireSubtabs(container) {
  container.querySelectorAll(".subtab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      container.querySelectorAll(".subtab-btn").forEach(b => b.classList.remove("active"));
      container.querySelectorAll(".subtab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      container.querySelector(".subtab-panel[data-day='" + btn.dataset.day + "']").classList.add("active");
    });
  });
}

// ─── Helpers ─────────────────────────────────────────────────────────────────

function fmt(v, d = 1) { return v == null ? "—" : Number(v).toFixed(d); }

function dayLabel(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}

function todayStr() { return new Date().toISOString().slice(0, 10); }

// Unique bet dates (descending) across all locations for bets matching typeMatch.
function collectDates(allBets, typeMatch) {
  const set = new Set();
  for (const data of Object.values(allBets)) {
    for (const d of (data?.days || [])) {
      if (d.bets.some(b => typeMatch(b.type))) set.add(d.date);
    }
  }
  return [...set].sort().reverse();
}

// Day-picker filter bar. `selected` is "all" or a date string; onSelect(value) fires on click.
function buildDayFilterBar(dates, selected, onSelect) {
  const bar = document.createElement("div");
  bar.className = "subtabs-header";
  const today = todayStr();

  const makeBtn = (value, label, active) => {
    const btn = document.createElement("button");
    btn.className = "subtab-btn" + (active ? " active" : "");
    btn.textContent = label;
    btn.addEventListener("click", () => {
      bar.querySelectorAll(".subtab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      onSelect(value);
    });
    return btn;
  };

  bar.appendChild(makeBtn("all", "All Days", selected === "all"));
  for (const date of dates) {
    bar.appendChild(makeBtn(date, date === today ? "Today" : dayLabel(date), selected === date));
  }
  return bar;
}

function renderOutcome(o, liveNoBid) {
  if (o === "W") return `<span class="outcome W">W</span>`;
  if (o === "L") return `<span class="outcome L">L</span>`;
  if (o === "pending") {
    if (liveNoBid != null) {
      if (liveNoBid >= 95) return `<span class="outcome W" title="NO bid ${liveNoBid}¢ — effectively won">≈W</span>`;
      if (liveNoBid <=  5) return `<span class="outcome L" title="NO bid ${liveNoBid}¢ — effectively lost">≈L</span>`;
    }
    return `<span class="outcome pending">pend</span>`;
  }
  return `<span class="outcome unknown">—</span>`;
}

function renderCurrentPrice(liveNoBid) {
  if (liveNoBid == null) return "—";
  const cls = liveNoBid >= 60 ? "pnl-pos" : liveNoBid <= 40 ? "pnl-neg" : "";
  return `<span class="${cls}">${liveNoBid}¢</span>`;
}

// Actual $ cost of a bet (contracts * price), not the size_usd config knob —
// the two diverge whenever floor(size_usd*100/no_price_cents) != size_usd numerically.
function renderCost(b) {
  if (b.count != null && b.no_price_cents != null) {
    return "$" + (b.count * b.no_price_cents / 100).toFixed(2);
  }
  return b.size_usd != null ? "$" + b.size_usd : "—";
}

function locSection(locName) {
  const div = document.createElement("div");
  div.className = "loc-section";
  div.innerHTML = `<div class="loc-header"><span>${locName}</span></div>`;
  return div;
}

// ─── Stats / P&L ─────────────────────────────────────────────────────────────

// count = actual filled contracts (not size_usd — the $ knob and the contract
// count diverge whenever floor(size_usd*100/no_price_cents) != size_usd numerically).
// cost = count * no_price_cents / 100, falling back to size_usd (like renderCost)
// when count isn't populated yet — otherwise those bets vanish from the totals
// entirely instead of just losing precision.
// Bets with live_no_bid >= 95 or <= 5 are treated as effectively settled for P&L purposes.
function computeStats(bets) {
  let cost = 0, settledCost = 0, realizedPnl = 0, unrealizedPnl = 0, wins = 0, losses = 0, pending = 0;
  for (const b of bets) {
    const np = b.no_price_cents, ct = b.count;
    const haveActual = np != null && ct != null;
    if (!haveActual && b.size_usd == null) continue;
    const bCost = haveActual ? ct * np / 100 : b.size_usd;
    const effectiveW = b.outcome === "W" || (b.outcome === "pending" && b.live_no_bid >= 95);
    const effectiveL = b.outcome === "L" || (b.outcome === "pending" && b.live_no_bid != null && b.live_no_bid <= 5);
    if (effectiveW) {
      cost += bCost; settledCost += bCost;
      if (haveActual) realizedPnl += ct * (100 - np) / 100;
      wins++;
    } else if (effectiveL) {
      cost += bCost; settledCost += bCost;
      realizedPnl -= bCost;
      losses++;
    } else {
      cost += bCost;
      pending++;
      if (haveActual && b.live_no_bid != null) unrealizedPnl += ct * (b.live_no_bid - np) / 100;
    }
  }
  const roi = settledCost > 0 ? realizedPnl / settledCost * 100 : null;
  return { total: bets.length, wins, losses, pending, cost, settledCost, realizedPnl, unrealizedPnl, roi };
}

function fmtMoney(v) {
  return (v >= 0 ? "+" : "-") + "$" + Math.abs(v).toFixed(2);
}

function renderTfoot(stats, colCount) {
  const pnlCls = stats.realizedPnl >= 0 ? "pnl-pos" : "pnl-neg";
  const roiStr = stats.roi != null ? ` · ROI&nbsp;${stats.roi.toFixed(1)}%` : "";
  const unrealStr = stats.unrealizedPnl !== 0
    ? ` · <span class="${stats.unrealizedPnl >= 0 ? "pnl-pos" : "pnl-neg"}">Unreal.&nbsp;${fmtMoney(stats.unrealizedPnl)}</span>`
    : "";
  const html = `${stats.total}&nbsp;bet${stats.total !== 1 ? "s" : ""} · `
    + `${stats.wins}W&nbsp;${stats.losses}L&nbsp;${stats.pending}&nbsp;pend · `
    + `Cost&nbsp;$${stats.cost.toFixed(2)} · `
    + `<span class="${pnlCls}">P&amp;L&nbsp;${fmtMoney(stats.realizedPnl)}${roiStr}</span>${unrealStr}`;
  const tf = document.createElement("tfoot");
  tf.innerHTML = `<tr><td colspan="${colCount}">${html}</td></tr>`;
  return tf;
}

function renderTotalsBar(title, statsArr) {
  const agg = { total: 0, wins: 0, losses: 0, pending: 0, cost: 0, settledCost: 0, realizedPnl: 0, unrealizedPnl: 0 };
  for (const s of statsArr) {
    agg.total          += s.total;
    agg.wins           += s.wins;
    agg.losses         += s.losses;
    agg.pending        += s.pending;
    agg.cost           += s.cost;
    agg.settledCost    += s.settledCost;
    agg.realizedPnl    += s.realizedPnl;
    agg.unrealizedPnl  += s.unrealizedPnl;
  }
  const roi = agg.settledCost > 0 ? agg.realizedPnl / agg.settledCost * 100 : null;
  const pnlCls = agg.realizedPnl >= 0 ? "pnl-pos" : "pnl-neg";
  const unrealCls = agg.unrealizedPnl >= 0 ? "pnl-pos" : "pnl-neg";
  const div = document.createElement("div");
  div.className = "totals-bar";
  div.innerHTML = `<h3>${title}</h3><div class="totals-grid">
    <div class="totals-item"><div class="lbl">Bets</div><div class="val">${agg.total}</div></div>
    <div class="totals-item"><div class="lbl">W / L</div><div class="val">${agg.wins} / ${agg.losses}</div></div>
    <div class="totals-item"><div class="lbl">Pending</div><div class="val">${agg.pending}</div></div>
    <div class="totals-item"><div class="lbl">Total Cost</div><div class="val">$${agg.cost.toFixed(2)}</div></div>
    <div class="totals-item"><div class="lbl">Realized P&amp;L</div><div class="val ${pnlCls}">${fmtMoney(agg.realizedPnl)}</div></div>
    ${agg.unrealizedPnl !== 0 ? `<div class="totals-item"><div class="lbl">Unrealized</div><div class="val ${unrealCls}">${fmtMoney(agg.unrealizedPnl)}</div></div>` : ""}
    ${roi != null ? `<div class="totals-item"><div class="lbl">ROI</div><div class="val ${pnlCls}">${roi.toFixed(1)}%</div></div>` : ""}
  </div>`;
  return div;
}

// ─── Daily tab ───────────────────────────────────────────────────────────────

function renderDailyContent(allBets, selectedDay) {
  const container = document.createElement("div");
  const allStats = [];

  for (const { code, name } of LOCATIONS) {
    const data = allBets[code];
    const sec = locSection(name);

    const bets = (data?.days || [])
      .filter(d => selectedDay === "all" || d.date === selectedDay)
      .flatMap(d => d.bets.filter(b => b.type === "daily").map(b => ({ ...b, date: d.date })));

    if (bets.length === 0) {
      sec.innerHTML += `<div class="no-data">No daily bets.</div>`;
      container.appendChild(sec);
      continue;
    }

    const tbl = document.createElement("table");
    tbl.innerHTML = `<thead><tr>
      <th>Date</th><th>Market</th><th>Side</th>
      <th>NO&nbsp;¢</th><th>Model&nbsp;NO%</th><th>Size</th>
      <th>μ&nbsp;/&nbsp;σ</th><th>Current&nbsp;Mkt&nbsp;¢</th><th>Outcome</th>
    </tr></thead>`;
    const tb = document.createElement("tbody");
    for (const b of bets) {
      const tr = document.createElement("tr");
      const market = b.bucket_label
        ? `<span style="font-weight:500">${b.bucket_label}</span><br><span class="ticker">${b.ticker}</span>`
        : `<span class="ticker">${b.ticker}</span>`;
      tr.innerHTML = `
        <td class="date-cell">${dayLabel(b.date)}</td>
        <td class="market-cell">${market}</td>
        <td>${(b.side || "no").toUpperCase()}</td>
        <td>${b.no_price_cents != null ? b.no_price_cents + "¢" : "—"}</td>
        <td>${b.model_no_prob != null ? (b.model_no_prob * 100).toFixed(1) + "%" : "—"}</td>
        <td>${renderCost(b)}</td>
        <td>${b.model_mu != null ? fmt(b.model_mu) + "°&nbsp;/&nbsp;" + fmt(b.model_sigma, 2) + "σ" : "—"}</td>
        <td>${renderCurrentPrice(b.live_no_bid)}</td>
        <td>${renderOutcome(b.outcome, b.live_no_bid)}</td>`;
      tb.appendChild(tr);
    }
    tbl.appendChild(tb);
    const stats = computeStats(bets);
    allStats.push(stats);
    tbl.appendChild(renderTfoot(stats, 9));
    sec.appendChild(tbl);
    container.appendChild(sec);
  }

  if (allStats.length) container.appendChild(renderTotalsBar("All Locations — Daily", allStats));
  return container;
}

function renderDailyTab(allBets) {
  const panel = document.getElementById("tab-daily");
  panel.innerHTML = "";

  const dates = collectDates(allBets, t => t === "daily");
  const contentDiv = document.createElement("div");

  panel.appendChild(buildDayFilterBar(dates, "all", (day) => {
    contentDiv.innerHTML = "";
    contentDiv.appendChild(renderDailyContent(allBets, day));
  }));

  contentDiv.appendChild(renderDailyContent(allBets, "all"));
  panel.appendChild(contentDiv);
}

// ─── Intraday tab ────────────────────────────────────────────────────────────

function renderIntradayContent(allBets, selectedDay) {
  const container = document.createElement("div");
  const allStats = [];

  for (const { code, name } of LOCATIONS) {
    const data = allBets[code];
    const sec = locSection(name);

    const bets = (data?.days || [])
      .filter(d => selectedDay === "all" || d.date === selectedDay)
      .flatMap(d => d.bets.filter(b => b.type.startsWith("intraday_")).map(b => ({ ...b, date: d.date })));

    if (bets.length === 0) {
      sec.innerHTML += `<div class="no-data">No intraday bets.</div>`;
      container.appendChild(sec);
      continue;
    }

    const tbl = document.createElement("table");
    tbl.innerHTML = `<thead><tr>
      <th>Date</th><th>Snap</th><th>Market</th><th>Side</th>
      <th>NO&nbsp;¢</th><th>Model&nbsp;NO%</th><th>Edge</th>
      <th>Size</th><th>Current&nbsp;Mkt&nbsp;¢</th><th>Outcome</th>
    </tr></thead>`;
    const tb = document.createElement("tbody");
    for (const b of bets) {
      const snap = b.type.replace("intraday_", "");
      const tr = document.createElement("tr");
      const market = b.bucket_label
        ? `<span style="font-weight:500">${b.bucket_label}</span><br><span class="ticker">${b.ticker}</span>`
        : `<span class="ticker">${b.ticker}</span>`;
      tr.innerHTML = `
        <td class="date-cell">${dayLabel(b.date)}</td>
        <td><span class="snap-badge">${snap}</span></td>
        <td class="market-cell">${market}</td>
        <td>${(b.side || "no").toUpperCase()}</td>
        <td>${b.no_price_cents != null ? b.no_price_cents + "¢" : "—"}</td>
        <td>${b.model_no_prob != null ? (b.model_no_prob * 100).toFixed(1) + "%" : "—"}</td>
        <td>${b.edge != null ? (b.edge * 100).toFixed(1) + "%" : "—"}</td>
        <td>${renderCost(b)}</td>
        <td>${renderCurrentPrice(b.live_no_bid)}</td>
        <td>${renderOutcome(b.outcome, b.live_no_bid)}</td>`;
      tb.appendChild(tr);
    }
    tbl.appendChild(tb);
    const stats = computeStats(bets);
    allStats.push(stats);
    tbl.appendChild(renderTfoot(stats, 10));
    sec.appendChild(tbl);
    container.appendChild(sec);
  }

  if (allStats.length) container.appendChild(renderTotalsBar("All Locations — Intraday", allStats));
  return container;
}

function renderIntradayTab(allBets) {
  const panel = document.getElementById("tab-intraday");
  panel.innerHTML = "";

  const dates = collectDates(allBets, t => t.startsWith("intraday_"));
  const contentDiv = document.createElement("div");

  panel.appendChild(buildDayFilterBar(dates, "all", (day) => {
    contentDiv.innerHTML = "";
    contentDiv.appendChild(renderIntradayContent(allBets, day));
  }));

  contentDiv.appendChild(renderIntradayContent(allBets, "all"));
  panel.appendChild(contentDiv);
}

// ─── Forecast tab ────────────────────────────────────────────────────────────

function computeScale(allForecast, dayIndex) {
  let lo = Infinity, hi = -Infinity;
  for (const data of Object.values(allForecast)) {
    const day = data?.days?.[dayIndex];
    if (!day) continue;
    if (day.daily?.mu != null) {
      lo = Math.min(lo, day.daily.mu - 2.5 * day.daily.sigma);
      hi = Math.max(hi, day.daily.mu + 2.5 * day.daily.sigma);
    }
    for (const s of (day.intraday || [])) {
      if (s.mu != null) {
        lo = Math.min(lo, s.mu - 2.5 * s.sigma);
        hi = Math.max(hi, s.mu + 2.5 * s.sigma);
      }
    }
  }
  if (!isFinite(lo)) return { lo: 50, hi: 110 };
  const step = 5;
  return { lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step };
}

function buildForecastCard(locName, day, scale, generatedAt) {
  const { lo, hi } = scale;
  const span = hi - lo;
  const p = t => Math.max(0, Math.min(100, (t - lo) / span * 100));

  const card = document.createElement("div");
  card.className = "fc-card";
  card.innerHTML = `<div class="fc-card-header"><span>${locName}</span></div>`;

  const rows = [];
  if (day?.daily?.mu != null)
    rows.push({ label: "Daily", rowCls: "daily-row", lblCls: "daily-lbl", mu: day.daily.mu, sigma: day.daily.sigma, obs: null, obsMax: day.obs_daily_max });
  const sortedIntraday = (day?.intraday || []).slice().sort((a, b) => a.hour - b.hour);
  for (const s of sortedIntraday) {
    if (s.mu != null)
      rows.push({ label: String(s.hour).padStart(2, "0") + "h", rowCls: "intra-row", lblCls: "intra-lbl", mu: s.mu, sigma: s.sigma, obs: s.obs_temp, obsMax: s.obs_max });
  }

  // Latest-run row: the freshest reading, labeled with the actual last-run
  // clock time instead of being snapped to an intraday hour bucket.
  if (generatedAt) {
    const latestSnap = sortedIntraday.length ? sortedIntraday[sortedIntraday.length - 1] : null;
    const latestMu = latestSnap?.mu ?? day?.daily?.mu;
    const latestSigma = latestSnap?.sigma ?? day?.daily?.sigma;
    if (latestMu != null) {
      rows.push({
        label: generatedAt.slice(11, 16),
        rowCls: "latest-row", lblCls: "latest-lbl",
        mu: latestMu, sigma: latestSigma,
        obs: latestSnap?.obs_temp ?? null, obsMax: latestSnap?.obs_max ?? day?.obs_daily_max,
      });
    }
  }

  if (rows.length === 0) {
    card.innerHTML += `<div class="no-forecast">No forecast data.</div>`;
    return card;
  }

  for (const row of rows) {
    const lo2 = p(row.mu - 2 * row.sigma), hi2 = p(row.mu + 2 * row.sigma);
    const lo1 = p(row.mu - row.sigma),     hi1 = p(row.mu + row.sigma);
    const muP = p(row.mu);

    let obsHtml = "";
    if (row.obs != null) {
      obsHtml = `<span class="obs-val">${row.obs}°F</span> <span class="obs-max">/ max ${row.obsMax != null ? row.obsMax + "°F" : "—"}</span>`;
    } else if (row.obsMax != null) {
      // Daily row — show obs max for the day
      obsHtml = `<span class="obs-max">Obs max: <span class="obs-val">${row.obsMax}°F</span></span>`;
    }

    const rowEl = document.createElement("div");
    rowEl.className = "fc-row " + row.rowCls;
    rowEl.innerHTML = `
      <div class="fc-label ${row.lblCls}">${row.label}</div>
      <div class="fc-meta"><strong>${fmt(row.mu)}°F</strong>&nbsp;±${fmt(row.sigma, 2)}σ</div>
      <div class="fc-bar">
        <div class="fc-2s" style="left:${lo2.toFixed(2)}%;width:${(hi2-lo2).toFixed(2)}%"></div>
        <div class="fc-1s" style="left:${lo1.toFixed(2)}%;width:${(hi1-lo1).toFixed(2)}%"></div>
        <div class="fc-mu" style="left:${muP.toFixed(2)}%"></div>
      </div>
      <div class="fc-obs">${obsHtml}</div>`;
    card.appendChild(rowEl);
  }

  // Scale row
  const scaleRow = document.createElement("div");
  scaleRow.className = "fc-scale-row";
  scaleRow.innerHTML = `<div class="fc-scale-spc"></div>`;
  const scaleEl = document.createElement("div");
  scaleEl.className = "fc-scale";
  const tickStep = span <= 10 ? 1 : span <= 25 ? 2 : 5;
  const firstTick = Math.ceil(lo / tickStep) * tickStep;
  for (let t = firstTick; t <= hi; t += tickStep) {
    const tick = document.createElement("div");
    tick.className = "fc-tick";
    tick.style.left = p(t).toFixed(2) + "%";
    tick.textContent = t + "°";
    scaleEl.appendChild(tick);
  }
  scaleRow.appendChild(scaleEl);
  scaleRow.innerHTML += `<div class="fc-obs-spc"></div>`;
  card.appendChild(scaleRow);

  return card;
}

function renderForecastTab(allForecast) {
  const panel = document.getElementById("tab-forecast");
  panel.innerHTML = "";

  // Collect unique dates across all locations (up to 3 days back)
  const dateSet = new Set();
  for (const data of Object.values(allForecast)) {
    for (const day of (data?.days || [])) dateSet.add(day.date);
  }
  const dates = [...dateSet].sort().reverse().slice(0, 3);
  if (dates.length === 0) {
    panel.innerHTML = `<div class="no-forecast">No forecast data available.</div>`;
    return;
  }

  // Sub-tab bar
  const subHeader = document.createElement("div");
  subHeader.className = "subtabs-header";
  const today = new Date().toISOString().slice(0, 10);
  dates.forEach((date, i) => {
    const label = date === today ? "Today" : dayLabel(date);
    const btn = document.createElement("button");
    btn.className = "subtab-btn" + (i === 0 ? " active" : "");
    btn.dataset.day = date;
    btn.textContent = label;
    subHeader.appendChild(btn);
  });
  panel.appendChild(subHeader);

  // Sub-tab panels (one per date)
  dates.forEach((date, di) => {
    const dayPanel = document.createElement("div");
    dayPanel.className = "subtab-panel" + (di === 0 ? " active" : "");
    dayPanel.dataset.day = date;

    // Compute scale across all locations for this date
    const scale = computeScale(allForecast, di);

    for (const { code, name } of LOCATIONS) {
      const data = allForecast[code];
      const day = data?.days?.[di];
      const generatedAt = (di === 0 && data?.generated_at) ? data.generated_at : null;
      dayPanel.appendChild(buildForecastCard(name, day, scale, generatedAt));
    }
    panel.appendChild(dayPanel);
  });

  wireSubtabs(panel);
}

// ─── Load ────────────────────────────────────────────────────────────────────

async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function load() {
  const t = Date.now();

  const [betsResults, fcResults] = await Promise.all([
    Promise.allSettled(LOCATIONS.map(l => fetchJson(`data/recent_bets_${l.code}.json?t=${t}`))),
    Promise.allSettled(LOCATIONS.map(l => fetchJson(`data/forecast_${l.code}.json?t=${t}`))),
  ]);

  const allBets = {}, allForecast = {};
  LOCATIONS.forEach(({ code }, i) => {
    if (betsResults[i].status === "fulfilled") allBets[code] = betsResults[i].value;
    if (fcResults[i].status   === "fulfilled") allForecast[code] = fcResults[i].value;
  });

  // Timestamp from first successful bets result
  const firstBets = Object.values(allBets)[0];
  if (firstBets?.generated_at) {
    document.getElementById("last-updated").textContent = firstBets.generated_at.replace("T", " ");
  }

  renderDailyTab(allBets);
  renderIntradayTab(allBets);
  renderForecastTab(allForecast);
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
