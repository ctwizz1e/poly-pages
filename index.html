<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Bot</title>
  <style>
    :root {
      --bg:         #f0f2f5;
      --surface:    #ffffff;
      --border:     #e1e4e8;
      --text:       #24292e;
      --text-muted: #6a737d;
      --accent:     #0366d6;
      --win:        #22863a;
      --loss:       #cb2431;
      --radius:     8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 17px; font-weight: 600; }
    #location-nav { display: flex; gap: 8px; flex-wrap: wrap; }
    #location-nav a {
      font-size: 13px; padding: 3px 10px; border-radius: 12px;
      text-decoration: none; color: var(--text-muted);
      border: 1px solid var(--border);
    }
    #location-nav a.active { background: var(--accent); color: #fff; border-color: transparent; }
    #status-bar { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    #status-bar span { font-weight: 500; color: var(--text); }

    /* ── Tabs ── */
    .tabs-header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 0 24px;
      display: flex;
    }
    .tab-btn {
      padding: 10px 20px;
      font-size: 13px; font-weight: 500;
      border: none; background: none; cursor: pointer;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    main { max-width: 960px; margin: 0 auto; padding: 20px 16px; }

    /* ── Bets tab ── */
    .day-section { margin-bottom: 24px; }
    .day-section h2 {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .5px; color: var(--text-muted);
      margin-bottom: 10px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .day-section h2 span { color: var(--text); }
    .no-bets { font-size: 13px; color: var(--text-muted); padding: 8px 0; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .4px; color: var(--text-muted);
      padding: 4px 10px 6px 0; text-align: left; white-space: nowrap;
    }
    thead th:last-child { text-align: center; }
    tbody td {
      padding: 6px 10px 6px 0; border-top: 1px solid var(--border);
      vertical-align: middle; white-space: nowrap;
    }
    tbody tr:hover td { background: #f8f9fa; }

    .ticker { font-family: monospace; font-size: 12px; color: var(--text-muted); }
    .type-badge {
      font-size: 11px; padding: 1px 6px; border-radius: 10px;
      background: #f1f3f5; border: 1px solid var(--border); color: var(--text-muted);
    }
    .type-badge.daily { background: #ddf4ff; border-color: #b6e3ff; color: #0969da; }

    .outcome {
      display: inline-block; width: 28px; text-align: center;
      font-weight: 700; font-size: 13px; padding: 2px 4px; border-radius: 4px;
    }
    .outcome.W { color: var(--win);  background: #dcffe4; }
    .outcome.L { color: var(--loss); background: #ffebe9; }
    .outcome.pending { color: var(--text-muted); background: #f1f3f5; font-weight: 400; font-size: 11px; }
    .outcome.unknown { color: var(--text-muted); }
    td.outcome-cell { text-align: center; }

    /* ── Forecast tab ── */
    .forecast-day { margin-bottom: 24px; }
    .forecast-day > h2 {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .5px; color: var(--text-muted);
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .forecast-day > h2 span { color: var(--text); }

    .forecast-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      overflow-x: auto;
    }

    /* Each row: label | meta | bar */
    .fc-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 500px;
    }
    .fc-row + .fc-row { margin-top: 8px; }

    .fc-label {
      width: 56px; flex-shrink: 0;
      font-size: 12px; font-weight: 600; text-align: right;
      color: var(--text-muted);
    }
    .fc-label.daily-label   { color: #0969da; }
    .fc-label.intraday-label { color: var(--win); }

    .fc-meta {
      width: 96px; flex-shrink: 0;
      font-size: 12px; color: var(--text-muted);
    }
    .fc-meta strong { color: var(--text); font-size: 13px; }

    .fc-bar {
      flex: 1;
      position: relative;
      height: 22px;
    }

    /* Bands: positioned as % of bar width (= temperature scale) */
    .fc-2s, .fc-1s, .fc-mu { position: absolute; top: 0; height: 100%; }

    .fc-2s { border-radius: 6px; top: 5px; height: 12px; }
    .fc-1s { border-radius: 4px; top: 3px; height: 16px; }
    .fc-mu { width: 3px; border-radius: 2px; transform: translateX(-50%); }

    .fc-row.daily-row   .fc-2s { background: rgba(9,105,218,.14); }
    .fc-row.daily-row   .fc-1s { background: rgba(9,105,218,.42); }
    .fc-row.daily-row   .fc-mu { background: #0969da; }

    .fc-row.intra-row   .fc-2s { background: rgba(34,134,58,.14); }
    .fc-row.intra-row   .fc-1s { background: rgba(34,134,58,.42); }
    .fc-row.intra-row   .fc-mu { background: #22863a; }

    /* Scale row */
    .fc-scale-row {
      display: flex; align-items: flex-start; gap: 12px;
      min-width: 500px;
      margin-top: 10px;
    }
    .fc-scale-spacer { width: calc(56px + 96px + 12px + 12px); flex-shrink: 0; }
    .fc-scale { flex: 1; position: relative; height: 16px; border-top: 1px solid var(--border); }
    .fc-tick {
      position: absolute; top: 2px;
      font-size: 10px; color: var(--text-muted);
      transform: translateX(-50%); white-space: nowrap;
    }

    /* Legend */
    .fc-legend {
      display: flex; gap: 16px; flex-wrap: wrap;
      margin-bottom: 14px; font-size: 12px; color: var(--text-muted);
    }
    .fc-legend-item { display: flex; align-items: center; gap: 5px; }
    .fc-legend-swatch {
      width: 14px; height: 10px; border-radius: 3px;
    }

    .no-forecast { font-size: 13px; color: var(--text-muted); padding: 8px 0; }
    .loading { color: var(--text-muted); font-size: 13px; padding: 8px 0; }
    .error   { color: var(--loss);       font-size: 13px; padding: 8px 0; }
  </style>
</head>
<body>

<header>
  <h1 id="page-title">Weather Bot</h1>
  <nav id="location-nav">
    <a href="?location=atl">Atlanta</a>
    <a href="?location=bos">Boston</a>
    <a href="?location=chi">Chicago</a>
    <a href="?location=dal">Dallas</a>
    <a href="?location=dc">Washington DC</a>
    <a href="?location=lax">Los Angeles</a>
    <a href="?location=mia">Miami</a>
    <a href="?location=nyc">New York City</a>
    <a href="?location=sfo">San Francisco</a>
  </nav>
  <div id="status-bar">Updated: <span id="last-updated">—</span></div>
</header>

<div class="tabs-header">
  <button class="tab-btn active" data-tab="bets">Bets</button>
  <button class="tab-btn" data-tab="forecast">Forecast</button>
</div>

<main>
  <div class="tab-panel active" id="tab-bets">
    <div class="loading">Loading…</div>
  </div>
  <div class="tab-panel" id="tab-forecast">
    <div class="loading">Loading…</div>
  </div>
</main>

<script>
const LOC = (new URLSearchParams(window.location.search).get("location") || "atl").toLowerCase();

document.querySelectorAll("#location-nav a").forEach(a => {
  const p = new URL(a.href, location.href).searchParams.get("location") || "atl";
  if (p === LOC) a.classList.add("active");
});

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

function fmt(v, d = 1) { return v == null ? "—" : Number(v).toFixed(d); }

function renderOutcome(o) {
  if (o === "W" || o === "L") return `<span class="outcome ${o}">${o}</span>`;
  if (o === "pending")        return `<span class="outcome pending">pend</span>`;
  return `<span class="outcome unknown">—</span>`;
}

// ─── Bets tab ───────────────────────────────────────────────────────────────

function renderBetsDay(day) {
  const sec = document.createElement("div");
  sec.className = "day-section";
  const date  = new Date(day.date + "T12:00:00");
  const label = date.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  sec.innerHTML = `<h2><span>${label}</span> — ${day.date}</h2>`;

  if (!day.bets || day.bets.length === 0) {
    sec.innerHTML += `<div class="no-bets">No bets placed.</div>`;
    return sec;
  }

  const tbl = document.createElement("table");
  tbl.innerHTML = `<thead><tr>
    <th>Type</th><th>Market</th><th>Side</th>
    <th>Entry (NO&nbsp;¢)</th><th>Model NO%</th><th>Edge</th>
    <th>Size</th><th>μ&nbsp;/&nbsp;σ</th><th>Outcome</th>
  </tr></thead>`;
  const tb = document.createElement("tbody");
  for (const bet of day.bets) {
    const daily = bet.type === "daily";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="type-badge ${daily ? "daily" : ""}">${bet.type}</span></td>
      <td class="ticker">${bet.ticker}</td>
      <td>${(bet.side || "no").toUpperCase()}</td>
      <td>${bet.no_price_cents != null ? bet.no_price_cents + "¢" : "—"}</td>
      <td>${bet.model_no_prob != null ? (bet.model_no_prob * 100).toFixed(1) + "%" : "—"}</td>
      <td>${bet.edge != null ? (bet.edge * 100).toFixed(1) + "%" : "—"}</td>
      <td>${bet.size_usd != null ? "$" + bet.size_usd : "—"}</td>
      <td>${bet.model_mu != null ? fmt(bet.model_mu) + "°&nbsp;/&nbsp;" + fmt(bet.model_sigma, 2) + "σ" : "—"}</td>
      <td class="outcome-cell">${renderOutcome(bet.outcome)}</td>`;
    tb.appendChild(tr);
  }
  tbl.appendChild(tb);
  sec.appendChild(tbl);
  return sec;
}

// ─── Forecast tab ────────────────────────────────────────────────────────────

function computeScale(days) {
  let lo = Infinity, hi = -Infinity;
  for (const d of days) {
    if (d.daily?.mu != null) {
      lo = Math.min(lo, d.daily.mu - 2.5 * d.daily.sigma);
      hi = Math.max(hi, d.daily.mu + 2.5 * d.daily.sigma);
    }
    for (const s of (d.intraday || [])) {
      if (s.mu != null) {
        lo = Math.min(lo, s.mu - 2.5 * s.sigma);
        hi = Math.max(hi, s.mu + 2.5 * s.sigma);
      }
    }
  }
  if (!isFinite(lo)) return { lo: 50, hi: 110 };
  const step = 5;
  return { lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step };
}

function buildForecastDay(day, scale) {
  const { lo, hi } = scale;
  const span = hi - lo;
  const p = t => Math.max(0, Math.min(100, (t - lo) / span * 100));

  const wrap = document.createElement("div");
  wrap.className = "forecast-day";
  const date  = new Date(day.date + "T12:00:00");
  const label = date.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  wrap.innerHTML = `<h2><span>${label}</span> — ${day.date}</h2>`;

  const card = document.createElement("div");
  card.className = "forecast-card";

  // Collect rows: daily first, then intraday sorted by hour
  const rows = [];
  if (day.daily?.mu != null)
    rows.push({ label: "Daily", rowCls: "daily-row", labelCls: "daily-label", mu: day.daily.mu, sigma: day.daily.sigma });
  for (const s of (day.intraday || []).slice().sort((a, b) => a.hour - b.hour)) {
    if (s.mu != null)
      rows.push({ label: String(s.hour).padStart(2,"0") + "h", rowCls: "intra-row", labelCls: "intraday-label", mu: s.mu, sigma: s.sigma });
  }

  if (rows.length === 0) {
    card.innerHTML = `<div class="no-forecast">No forecast data yet.</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  // Legend
  const legend = document.createElement("div");
  legend.className = "fc-legend";
  legend.innerHTML = `
    <div class="fc-legend-item">
      <div class="fc-legend-swatch" style="background:rgba(9,105,218,.42)"></div>±1σ (68%)
    </div>
    <div class="fc-legend-item">
      <div class="fc-legend-swatch" style="background:rgba(9,105,218,.14)"></div>±2σ (95%)
    </div>
    <div class="fc-legend-item" style="color:#0969da;font-weight:600">■ Daily model</div>
    <div class="fc-legend-item" style="color:#22863a;font-weight:600">■ Intraday snap</div>`;
  card.appendChild(legend);

  for (const row of rows) {
    const rowEl = document.createElement("div");
    rowEl.className = "fc-row " + row.rowCls;

    const lo2 = p(row.mu - 2 * row.sigma), hi2 = p(row.mu + 2 * row.sigma);
    const lo1 = p(row.mu - row.sigma),     hi1 = p(row.mu + row.sigma);
    const muP = p(row.mu);

    rowEl.innerHTML = `
      <div class="fc-label ${row.labelCls}">${row.label}</div>
      <div class="fc-meta"><strong>${fmt(row.mu)}°F</strong>&nbsp;±${fmt(row.sigma, 2)}σ</div>
      <div class="fc-bar">
        <div class="fc-2s" style="left:${lo2.toFixed(2)}%;width:${(hi2-lo2).toFixed(2)}%"></div>
        <div class="fc-1s" style="left:${lo1.toFixed(2)}%;width:${(hi1-lo1).toFixed(2)}%"></div>
        <div class="fc-mu" style="left:${muP.toFixed(2)}%"></div>
      </div>`;
    card.appendChild(rowEl);
  }

  // Temperature scale
  const scaleRow = document.createElement("div");
  scaleRow.className = "fc-scale-row";
  scaleRow.innerHTML = `<div class="fc-scale-spacer"></div>`;
  const scaleEl = document.createElement("div");
  scaleEl.className = "fc-scale";

  const tickStep = span <= 10 ? 1 : span <= 25 ? 2 : 5;
  const firstTick = Math.ceil(lo / tickStep) * tickStep;
  for (let t = firstTick; t <= hi; t += tickStep) {
    const tick = document.createElement("div");
    tick.className = "fc-tick";
    tick.style.left = p(t).toFixed(2) + "%";
    tick.textContent = t + "°";
    scaleEl.appendChild(tick);
  }
  scaleRow.appendChild(scaleEl);
  card.appendChild(scaleRow);

  wrap.appendChild(card);
  return wrap;
}

// ─── Load ────────────────────────────────────────────────────────────────────

async function load() {
  const t = Date.now();
  const [betsRes, fcRes] = await Promise.allSettled([
    fetch(`data/recent_bets_${LOC}.json?t=${t}`).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
    fetch(`data/forecast_${LOC}.json?t=${t}`).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
  ]);

  if (betsRes.status === "fulfilled") {
    const d = betsRes.value;
    document.getElementById("page-title").textContent = `Weather Bot — ${d.location_name || LOC.toUpperCase()}`;
    document.getElementById("last-updated").textContent = d.generated_at ? d.generated_at.replace("T", " ") : "—";
  }

  // Bets tab
  const betsPanel = document.getElementById("tab-bets");
  betsPanel.innerHTML = "";
  if (betsRes.status === "fulfilled") {
    const days = betsRes.value.days || [];
    if (days.length === 0) {
      betsPanel.innerHTML = `<div class="no-bets">No recent bet data available.</div>`;
    } else {
      for (const day of days) betsPanel.appendChild(renderBetsDay(day));
    }
  } else {
    betsPanel.innerHTML = `<div class="error">Failed to load bets: ${betsRes.reason?.message || "unknown"}</div>`;
  }

  // Forecast tab
  const fcPanel = document.getElementById("tab-forecast");
  fcPanel.innerHTML = "";
  if (fcRes.status === "fulfilled") {
    const days = fcRes.value.days || [];
    const hasData = days.some(d => d.daily || d.intraday?.length);
    if (!hasData) {
      fcPanel.innerHTML = `<div class="no-forecast">No forecast data available.</div>`;
    } else {
      const scale = computeScale(days);
      for (const day of days) fcPanel.appendChild(buildForecastDay(day, scale));
    }
  } else {
    fcPanel.innerHTML = `<div class="no-forecast">Forecast data will appear after the next scheduler run.</div>`;
  }
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
